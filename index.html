<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéLearn Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .silhouette { filter: brightness(0); }
        @keyframes shiny-sparkle {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px #facc15); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px #facc15); }
        }
        .shiny-active { animation: shiny-sparkle 1.5s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full flex justify-between items-center mb-4 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
        <div>
            <span class="text-xs text-slate-400 block font-bold uppercase tracking-wider">Current Streak</span>
            <span id="score-count" class="text-xl font-black text-green-400">0</span>
        </div>
        <div class="text-right">
            <span class="text-xs text-slate-400 block font-bold uppercase tracking-wider">Shinies Found</span>
            <span id="shiny-count" class="text-xl font-black text-yellow-400">0</span>
        </div>
    </div>

    <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700 text-center">
        <div id="shiny-banner" class="hidden text-sm bg-yellow-500/20 text-yellow-400 font-extrabold py-1 px-3 rounded-full mb-3 inline-block animate-pulse border border-yellow-500/30">
            ✨ SHINY ENCOUNTER! (1/10 CHANCE) ✨
        </div>

        <h1 class="text-2xl font-extrabold text-slate-200 tracking-wide">PokéLearn Training</h1>
        <p class="text-xs text-slate-400 mb-4">Master names, variants, and spelling</p>

        <div class="bg-slate-950 rounded-lg p-6 flex flex-col items-center justify-center relative min-h-[220px]">
            <div id="loading" class="text-xl font-bold text-slate-500">Searching tall grass...</div>
            <img id="pokemon-sprite" class="w-40 h-40 silhouette hidden transition-all duration-300" src="" alt="Mystery Pokemon">
        </div>

        <div class="mt-3 min-h-[40px]">
            <button type="button" id="hint-btn" class="text-xs text-yellow-500 hover:underline font-medium">Show Memory Hint 💡</button>
            <p id="hint-text" class="text-xs italic text-slate-400 mt-1 hidden"></p>
        </div>

        <div id="feedback" class="h-8 my-2 text-md font-bold flex items-center justify-center"></div>

        <form id="quiz-form" class="space-y-3">
            <input 
                type="text" 
                id="guess-input" 
                placeholder="Spell the Pokémon name..." 
                autocomplete="off"
                class="w-full px-4 py-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 font-bold text-center text-md uppercase tracking-wide"
                disabled
            >
            <div class="flex gap-2">
                <button type="submit" id="submit-btn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-extrabold py-2.5 px-4 rounded-lg transition disabled:opacity-50" disabled>Check Answer</button>
                <button type="button" id="next-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-2.5 px-4 rounded-lg transition hidden">Next Encounter ➡️</button>
            </div>
        </form>
    </div>

    <script>
        // Local Custom Data (Mnemonics for tricky names)
        const memoryHints = {
            "exeggcute": "Think: Multiple walking 'eggs' that 'execute' a plan. Spelled: E-X-E-G-G-C-U-T-E.",
            "gyarados": "Sounds like 'Glares at us'—because it's always angry.",
            "arcanine": "Combining 'Arcane' (mystical) and 'Canine' (dog).",
            "fletchinder": "A bird made of arrows ('fletching') and 'cinder' (fire).",
            "sudowoodo": "A fake tree. Pseudo (Sudo) + Wood."
        };

        // Game Tracking State
        let currentPokemonName = "";
        let isShinyEncounter = false;
        let currentStreak = 0;
        let shiniesCaught = 0;
        const totalPokemonRange = 151; // Generation 1 range

        // UI Target Elements
        const sprite = document.getElementById('pokemon-sprite');
        const loadingText = document.getElementById('loading');
        const feedback = document.getElementById('feedback');
        const guessInput = document.getElementById('guess-input');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const quizForm = document.getElementById('quiz-form');
        const hintBtn = document.getElementById('hint-btn');
        const hintText = document.getElementById('hint-text');
        const shinyBanner = document.getElementById('shiny-banner');
        const scoreCount = document.getElementById('score-count');
        const shinyCount = document.getElementById('shiny-count');

        async function fetchRandomPokemon() {
            // UI Reset Loop
            sprite.classList.add('hidden', 'silhouette', 'shiny-active');
            shinyBanner.classList.add('hidden');
            loadingText.classList.remove('hidden');
            hintText.classList.add('hidden');
            hintBtn.classList.remove('hidden');
            feedback.textContent = "";
            guessInput.value = "";
            guessInput.disabled = true;
            submitBtn.disabled = true;
            nextBtn.classList.add('hidden');
            submitBtn.classList.remove('hidden');

            // Calculate Random Identity & Shiny Rates (set to 10% for quick demo testing)
            const randomId = Math.floor(Math.random() * totalPokemonRange) + 1;
            isShinyEncounter = Math.random() < 0.10; 

            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${randomId}`);
                const data = await response.json();

                currentPokemonName = data.name.toLowerCase();

                // Select standard vs shiny variant textures
                if (isShinyEncounter) {
                    sprite.src = data.sprites.front_shiny;
                    shinyBanner.classList.remove('hidden');
                } else {
                    sprite.src = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;
                }

                // Inject custom mnemonic or provide standard syllable breakdown helper
                if (memoryHints[currentPokemonName]) {
                    hintText.textContent = memoryHints[currentPokemonName];
                } else {
                    hintText.textContent = `Starts with "${currentPokemonName.substring(0, 2).toUpperCase()}" and ends with "${currentPokemonName.slice(-1).toUpperCase()}". It has ${currentPokemonName.length} letters.`;
                }

                sprite.onload = () => {
                    loadingText.classList.add('hidden');
                    sprite.classList.remove('hidden');
                    guessInput.disabled = false;
                    submitBtn.disabled = false;
                    guessInput.focus();
                };
            } catch (err) {
                console.error("API Fetch Failure", err);
                loadingText.textContent = "Error finding Pokémon. Check internet connection.";
            }
        }

        // Evaluate Answer Logic
        quizForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const userGuess = guessInput.value.trim().toLowerCase();
            if (!userGuess) return;

            // Strip the silhouette mask
            sprite.classList.remove('silhouette');
            if (isShinyEncounter) sprite.classList.add('shiny-active');

            if (userGuess === currentPokemonName) {
                currentStreak++;
                scoreCount.textContent = currentStreak;
                
                if (isShinyEncounter) {
                    shiniesCaught++;
                    shinyCount.textContent = shiniesCaught;
                    feedback.innerHTML = `<span class="text-yellow-400">✨ Amazing! You caught a SHINY ${currentPokemonName.toUpperCase()}! ✨</span>`;
                } else {
                    feedback.innerHTML = `<span class="text-green-400">✓ Correct! It's ${currentPokemonName.toUpperCase()}!</span>`;
                }
            } else {
                currentStreak = 0; // Break win-streak
                scoreCount.textContent = currentStreak;
                feedback.innerHTML = `<span class="text-red-400">✗ Wrong. Correct spelling: ${currentPokemonName.toUpperCase()}</span>`;
            }

            // Lock UI controls for progression step
            guessInput.disabled = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            nextBtn.focus();
        });

        // Event hooks
        hintBtn.addEventListener('click', () => {
            hintText.classList.remove('hidden');
            hintBtn.classList.add('hidden');
        });
        nextBtn.addEventListener('click', fetchRandomPokemon);

        // Run Engine on initialize
        fetchRandomPokemon();
    </script>
</body>
</html>
